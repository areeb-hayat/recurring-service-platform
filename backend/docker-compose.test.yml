# Minimal PostgreSQL for running the test suite locally.
# Test-only convenience. This is NOT production deployment architecture:
# P0 §14 freezes production as one container + one managed PostgreSQL + one cron trigger.
#
#   docker compose -f docker-compose.test.yml up -d
#   export TEST_DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:55432/rsp_test
#   pytest
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rsp_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rsp_test"]
      interval: 2s
      timeout: 3s
      retries: 30
